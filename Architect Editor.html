<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<title>Architect Editor — Data Authoring Tool</title>
<meta name="viewport"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind CDN (configured for shadcn-style class names) -->
<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      container: {
        center: true,
        padding: '2rem',
        screens: { '2xl': '1400px' },
      },
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
        },
        colors: {
          border: 'hsl(var(--border))',
          input: 'hsl(var(--input))',
          ring: 'hsl(var(--ring))',
          background: 'hsl(var(--background))',
          foreground: 'hsl(var(--foreground))',
          primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
          secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
          destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
          muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
          accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
          popover: { DEFAULT: 'hsl(var(--popover))', foreground: 'hsl(var(--popover-foreground))' },
          card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
        },
        borderRadius: {
          lg: 'var(--radius)',
          md: 'calc(var(--radius) - 2px)',
          sm: 'calc(var(--radius) - 4px)',
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="src/tokens.css?v=4"/>

<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="hsl(240 10% 3.9%)"/>
  <g transform="translate(50 50)">
    <rect x="-24" y="-18" width="48" height="36" rx="3" fill="none" stroke="hsl(0 0% 98%)" stroke-width="2"/>
    <line x1="-24" y1="-6" x2="24" y2="-6" stroke="hsl(0 0% 98%)" stroke-width="1"/>
    <line x1="-8" y1="-18" x2="-8" y2="18" stroke="hsl(0 0% 98%)" stroke-width="1"/>
  </g>
</svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  window.__TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "density": "comfortable",
    "showInspector": true,
    "language": "English"
  }/*EDITMODE-END*/;
</script>
<script src="src/data.js?v=12"></script>
</head>
<body class="bg-background text-foreground antialiased overflow-hidden">
<div id="root"></div>

<script type="text/babel" src="src/ui.jsx?v=11"></script>
<script type="text/babel" src="src/command.jsx?v=2"></script>
<script type="text/babel" src="src/settings.jsx?v=1"></script>
<script type="text/babel" src="src/items.jsx?v=14"></script>
<script type="text/babel" src="src/loadouts.jsx?v=11"></script>
<script type="text/babel" src="src/crafting.jsx?v=11"></script>
<script type="text/babel" src="src/app.jsx?v=13"></script>

<script type="text/babel">
  const mount = () => {
    if (!window.App || !window.ItemsScreen || !window.LoadoutsScreen || !window.CraftingScreen || !window.SettingsCommand) {
      requestAnimationFrame(mount);
      return;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<window.App/>);
  };
  mount();
</script>
</body>
</html>
